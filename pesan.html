<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Form Pemesanan | WP-Rooms</title><meta name="description" content="Formulir pemesanan kamar Wisma Pemda Jawa Tengah."><meta name="theme-color" content="#183b35"><link rel="icon" href="assets/img/logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"><link rel="stylesheet" href="assets/css/style.css"><script defer src="assets/js/config.js"></script><script defer src="assets/js/utils.js"></script><script defer src="assets/js/api.js"></script><script defer src="assets/js/public.js"></script><script defer src="assets/js/booking.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"><meta property="og:type" content="website"><meta property="og:locale" content="id_ID"><meta property="og:site_name" content="WP-Rooms"><meta property="og:title" content="Form Pemesanan | WP-Rooms"><meta property="og:description" content="Formulir pemesanan kamar Wisma Pemda Jawa Tengah."><meta property="og:image" content="https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=1200&q=70"><meta name="twitter:card" content="summary_large_image"><meta name="robots" content="noindex"><script defer src="assets/js/konten.js"></script><script defer src="assets/js/extras.js"></script></head><body><header class="site-header"><div class="nav-wrap"><a class="brand" href="index.html"><img src="assets/img/logo.svg" alt=""><span>WP-ROOMS<small>WISMA PEMDA JAWA TENGAH</small></span></a><button class="menu-toggle" aria-label="Menu">☰</button><nav class="nav-links"><a href="index.html">Beranda</a><a href="kamar.html">Daftar Kamar</a><a href="galeri.html">Galeri</a><a href="lacak.html">Lacak Pesanan</a></nav></div></header><main><section class="page-hero"><div class="container"><h1>Form Pemesanan Kamar</h1><p>Lengkapi data dengan benar. Permohonan akan diverifikasi oleh petugas.</p></div></section><section class="section"><div class="container"><div class="content-card"><div id="booking-room-summary" class="alert">Memuat pilihan kamar…</div><form id="booking-form"><div class="form-grid"><div class="field"><label for="nama">Nama lengkap *</label><input id="nama" name="nama" required maxlength="120"></div><div class="field"><label for="instansi">Instansi / asal *</label><input id="instansi" name="instansi" required maxlength="160"></div><div class="field"><label for="nip">NIP (opsional)</label><input id="nip" name="nip" maxlength="40"></div><div class="field"><label for="hp">Nomor HP / WhatsApp *</label><input id="hp" name="hp" required inputmode="tel" placeholder="08xxxxxxxxxx"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email"></div><div class="field"><label for="jenis-tamu">Jenis tamu *</label><select id="jenis-tamu" name="jenis_tamu" required><option value="Dinas">Dinas</option><option value="Umum">Umum</option></select></div><div class="field"><label for="checkin">Tanggal check-in *</label><input id="checkin" name="checkin" type="date" required></div><div class="field"><label for="checkout">Tanggal check-out *</label><input id="checkout" name="checkout" type="date" required></div><div class="field"><label for="jumlah-tamu">Jumlah tamu *</label><input id="jumlah-tamu" name="jumlah_tamu" type="number" min="1" value="1" required></div><div class="field"><label for="keperluan">Keperluan *</label><input id="keperluan" name="keperluan" required maxlength="250"></div><div class="field wide" id="surat-field"><label for="surat-tugas">Surat tugas (wajib untuk Dinas, JPG/PNG/PDF maks. 2 MB)</label><input id="surat-tugas" type="file" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"><span class="hint">File disimpan privat di Google Drive. Pastikan admin yang berwenang memiliki akses.</span></div><div class="field wide"><label for="catatan">Catatan tambahan</label><textarea id="catatan" maxlength="1000"></textarea></div></div><input id="website" name="website" class="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true"><div id="booking-message" aria-live="polite"></div><label class="hint"><input id="agree" type="checkbox" required> Saya menyatakan data yang diisi benar dan menyetujui Syarat & Ketentuan.</label><p><button id="submit-booking" class="btn btn-gold" type="submit">Kirim Permohonan</button></p></form></div></div></section></main><footer class="site-footer"><div class="container"><div class="footer-bottom">© <span data-year></span> WP-Rooms</div></div></footer></body></html>
