<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login Admin | WP-Rooms</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin.css"><script defer src="../assets/js/config.js"></script><script defer src="../assets/js/utils.js"></script><script defer src="../assets/js/api.js"></script><script defer src="login.js"></script></head><body><main class="login-shell"><section class="login-card"><div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><img src="../assets/img/logo.svg" alt="" width="48"><div><h1>WP-Rooms</h1><div class="muted">Login Administrator</div></div></div><form id="login-form"><div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><div id="login-message" aria-live="polite"></div><button class="btn" id="login-button" type="submit" style="width:100%">Masuk Dashboard</button></form><form id="change-form" class="hidden"><div class="alert">Login pertama: ganti password sementara sebelum melanjutkan. Gunakan minimal 12 karakter, kombinasi huruf dan angka.</div><div class="field"><label for="old-password">Password sementara</label><input id="old-password" type="password" required></div><div class="field"><label for="new-password">Password baru</label><input id="new-password" type="password" minlength="12" required></div><div class="field"><label for="confirm-password">Ulangi password baru</label><input id="confirm-password" type="password" minlength="12" required></div><div id="change-message"></div><button class="btn btn-gold" id="change-button" type="submit" style="width:100%">Simpan Password Baru</button></form><p class="small-print" style="margin-top:20px">Akses hanya untuk petugas berwenang. Kembali ke <a href="../index.html">halaman publik</a>.</p></section></main></body></html>
